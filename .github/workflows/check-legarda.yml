name: Check DSWD Legarda Slots

on:
  schedule:
    # Runs every 10 minutes (GitHub Actions may jitter during peak UTC hours;
    # use workflow_dispatch + cron-job.org for strict 5-minute intervals)
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_alert:
        description: "Send a test screenshot alert to verify Telegram/Discord delivery"
        required: false
        default: false
        type: boolean

concurrency:
  group: check-legarda-slot-monitor
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-legarda:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12 (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve installed Playwright version for cache key
        id: pw-ver
        run: |
          echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium binaries
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw-ver.outputs.version }}

      - name: Install Playwright Chromium & system dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            playwright install --with-deps chromium
          else
            playwright install-deps chromium
          fi

      - name: Run Legarda slot monitor
        env:
          APPSHEET_SESSION_B64: ${{ secrets.APPSHEET_SESSION_B64 }}
          DSWD_MODE: ${{ secrets.DSWD_MODE }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_USER_ID: ${{ secrets.DISCORD_USER_ID }}
        run: |
          if [ "${{ inputs.test_alert }}" = "true" ]; then
            python -u monitor.py --test-alert
          else
            python -u monitor.py
          fi

      - name: Upload failure debug screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshot-${{ github.run_id }}-${{ github.run_attempt }}
          path: debug_*.png
          if-no-files-found: ignore
          retention-days: 7
